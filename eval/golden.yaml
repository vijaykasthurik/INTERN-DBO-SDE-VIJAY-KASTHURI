# Golden Evaluation Benchmark Dataset
benchmark_version: "1.0.0"
questions:
  - id: "q01_highest_revenue"
    category: "ranking"
    question: "Which region generated the highest revenue?"
    reference_sql: "SELECT region, SUM(quantity * unit_price * (1 - discount)) AS total_revenue FROM sales GROUP BY region ORDER BY total_revenue DESC LIMIT 1;"
    expected_top_value: "North America"

  - id: "q02_monthly_trend"
    category: "time-series"
    question: "Show monthly sales trends."
    reference_sql: "SELECT strftime('%Y-%m', order_date) AS month, SUM(quantity * unit_price * (1 - discount)) AS revenue FROM sales GROUP BY month ORDER BY month;"
    expected_row_count: 24

  - id: "q03_underperforming_products"
    category: "ranking"
    question: "Which products are underperforming?"
    reference_sql: "SELECT product_id, SUM(quantity * unit_price * (1 - discount)) AS revenue FROM sales GROUP BY product_id ORDER BY revenue ASC LIMIT 5;"
    expected_row_count: 5

  - id: "q04_top_five_customers"
    category: "ranking"
    question: "What are the top five customers?"
    reference_sql: "SELECT customer_id, SUM(quantity * unit_price * (1 - discount)) AS total_spend FROM sales GROUP BY customer_id ORDER BY total_spend DESC LIMIT 5;"
    expected_row_count: 5

  - id: "q05_generate_sql"
    category: "code_request"
    question: "Generate SQL for this analysis."
    reference_sql: "SELECT region, SUM(quantity * unit_price * (1 - discount)) FROM sales GROUP BY region;"

  - id: "q06_detect_anomalies"
    category: "anomaly"
    question: "Detect anomalies in the dataset."
    expected_anomalies_count: 5
