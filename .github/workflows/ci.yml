name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pandas-stubs pytest-cov

      - name: Ruff Lint & Formatting
        run: |
          ruff check backend/app

      - name: Mypy Typecheck
        run: |
          mypy backend/app

      - name: Pytest with Coverage
        run: |
          cd backend
          pytest tests/unit/test_health.py

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Frontend Lint
        run: |
          cd frontend
          npm run lint

      - name: Frontend Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Vitest Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Production Build
        run: |
          cd frontend
          npm run build
