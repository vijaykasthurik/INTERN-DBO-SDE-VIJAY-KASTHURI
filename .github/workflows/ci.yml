name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pandas-stubs pytest-cov

      - name: Ruff Lint & Formatting
        run: |
          ruff check --config backend/pyproject.toml backend/app

      - name: Mypy Typecheck
        run: |
          mypy --config-file backend/pyproject.toml backend/app

      - name: Pytest with Coverage
        env:
          APP_ENV: test
          LLM_PROVIDER: mock
        run: |
          cd backend
          pytest tests

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lumen_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pandas-stubs pytest-cov

      - name: Pytest against PostgreSQL
        env:
          APP_ENV: test
          LLM_PROVIDER: mock
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lumen_test
        run: |
          cd backend
          pytest tests

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Frontend Lint
        run: |
          cd frontend
          npm run lint

      - name: Frontend Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Vitest Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Production Build
        run: |
          cd frontend
          npm run build
