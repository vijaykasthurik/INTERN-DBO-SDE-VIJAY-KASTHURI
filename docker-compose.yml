services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lumen-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/lumen.db
      - DATA_DIR=/app/data
      - LLM_PROVIDER=mock
      - SECRET_KEY=production-secure-random-secret-key-min-32-chars
    volumes:
      - lumen-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lumen-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lumen-data:
    driver: local
