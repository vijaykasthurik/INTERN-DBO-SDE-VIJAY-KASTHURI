services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lumen-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/lumen.db
      - DATA_DIR=/app/data
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - SECRET_KEY=${SECRET_KEY}
      - KEY_ENCRYPTION_SECRET=${KEY_ENCRYPTION_SECRET}
    volumes:
      - lumen-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lumen-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lumen-data:
    driver: local
