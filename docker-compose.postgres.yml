version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen_secret_password_2026
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - lumen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  lumen-pgdata:
